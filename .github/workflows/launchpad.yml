# ESP Launchpad build + deploy.
#
# Builds every auto-discovered example for every supported target, then publishes the
# flashable merged binaries plus a generated Launchpad config to GitHub Pages.
#
# Shape:
#   build        — one job PER TARGET, builds all examples with the pinned IDF image and
#                  emits per-app merged binaries already laid out as the published site.
#   build-matter — the same for examples/matter/, on the pinned esp-matter image.
#   build-camera — examples/camera/standalone against the KVS WebRTC SDK: the ESP32-S3-EYE,
#                  and the ESP32-P4X-EYE and ESP32-P4-EYE with the C6 network_adapter
#                  image that each P4 image embeds.
#   deploy       — merges every target's artifact into one tree, generates launchpad.toml +
#                  README.md + index.html, and deploys the whole thing to Pages.
#
# End result: https://<owner>.github.io/<repo>/launchpad.toml , usable directly as
# https://espressif.github.io/esp-launchpad/?flashConfigURL=<that url>
#
# NOTE: the Pages site must be public for this to work at all — Launchpad is a browser
# app and fetches the config and binaries cross-origin.

name: Launchpad

# Every branch push is delivered, but the jobs below only run for the repository's
# DEFAULT branch (or a manual dispatch). `on.push.branches` cannot reference the default
# branch dynamically, and hardcoding a name silently disables the whole workflow whenever
# the mirror lands on a differently-named branch — so the filter lives in the job-level
# `if` instead. Pushes to other branches still create a run, but every job is skipped:
# no runner minutes, no Pages deployment.
#
# `branches: ['**']` keeps that dynamic check while filtering TAG pushes out entirely —
# a tag push would only ever produce a fully-skipped run, i.e. noise in the Actions
# history.
#
# `workflow_dispatch` is a deliberate testing escape hatch: it bypasses the default-branch
# filter, so dispatching from any branch builds THAT branch and deploys it over the live
# Pages site.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Required by actions/deploy-pages (OIDC-based deployment).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can be live. `cancel-in-progress: false` follows GitHub's
# Pages starter workflow: a newer run QUEUES behind an in-flight production deployment
# and supersedes it once that finishes, instead of killing it midway.
concurrency:
  group: launchpad-pages
  cancel-in-progress: false

env:
  # Space-separated example names/paths to keep out of Launchpad. Empty = build all.
  LAUNCHPAD_EXCLUDE: ""

jobs:
  build:
    # Espressif's copy only, default branch only (see the `on:` note above). deploy
    # needs: build, so it is skipped along with this job on every other ref.
    #
    # The owner check matters because this runs on the PUBLIC GitHub mirror: without it
    # every fork burns a full set of heavy IDF build jobs on each push to its default
    # branch, only to fail at the Pages deploy it has no permission for.
    if: >-
      github.repository_owner == 'espressif' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The launchpad coverage list — edit here to add or drop a chip.
        #
        # esp32h2 and esp32s2 are deliberately EXCLUDED, do not re-add them without
        # revisiting the reasons:
        #   - esp32s2 has no BLE, so provisioning falls back to SoftAP, and
        #     challenge-response based user-node mapping does not work well over it.
        #   - esp32h2 is Thread-only, and Thread is not yet validated with the phone apps.
        target: [esp32, esp32s3, esp32c2, esp32c3, esp32c5, esp32c6]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ccache is reused WITHIN a target, ACROSS apps: the examples share almost all of
      # IDF and the SDK components, so the second app onwards is mostly cache hits.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: launchpad-ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            launchpad-ccache-${{ matrix.target }}-

      - name: Build examples
        shell: bash
        env:
          IDF_TARGET: ${{ matrix.target }}
          SITE_DIR: ${{ github.workspace }}/site
          BUILD_TMP: ${{ github.workspace }}/launchpad_build_tmp
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          # pch_defines is left out on purpose: it lets a stale PCH outlive an sdkconfig change.
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          CCACHE_COMPILERCHECK: content
        run: |
          . "$IDF_PATH/export.sh"
          pip install idf-build-apps
          ccache --zero-stats || true
          # The container runs as a different user than the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          bash .github/tools/launchpad/build_launchpad.sh

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: launchpad-${{ matrix.target }}
          path: site
          retention-days: 7
          if-no-files-found: error

  # Matter examples build in their own job: they need the esp-matter SDK, which only the
  # espressif/esp-matter image carries, and `container.image` is per-job.
  build-matter:
    # Same gate as `build` — see the note there. Workflow YAML has no anchors, so the
    # expression is repeated verbatim.
    if: >-
      github.repository_owner == 'espressif' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    container:
      # Keep in sync with ESP_MATTER_IMAGE_TAG in .gitlab/matter.yml. `container.image`
      # accepts no `env` context, so the tag cannot move to the workflow `env:` block.
      image: espressif/esp-matter:release-v1.6_idf_v6.0.2
    # Higher than the IDF job's: a cold-ccache connectedhomeip build is the long pole.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with MATTER_TARGET in .gitlab/matter.yml; a target that
        # fails here skips the Pages deploy for EVERY example.
        target: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: launchpad-matter-ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            launchpad-matter-ccache-${{ matrix.target }}-

      # Same build script as `build`, pointed at the Matter subtree: EXAMPLES_DIR/<app>/main
      # is exactly the depth the discovery expects, so matter_light is found and
      # examples/matter/common/ (no `main/`) is not.
      - name: Build Matter examples
        shell: bash
        env:
          IDF_TARGET: ${{ matrix.target }}
          EXAMPLES_DIR: examples/matter
          SITE_DIR: ${{ github.workspace }}/site
          BUILD_TMP: ${{ github.workspace }}/launchpad_matter_build_tmp
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          # Smaller than the IDF job's, as in .gitlab/matter.yml: the repo shares one
          # 10 GB Actions cache budget across every target of both build jobs.
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          # pch_defines is left out on purpose: it lets a stale PCH outlive an sdkconfig change.
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          CCACHE_COMPILERCHECK: content
        run: |
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          pip install idf-build-apps
          ccache --zero-stats || true
          # The container runs as a different user than the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          git config --global --add safe.directory "$ESP_MATTER_PATH"
          bash .github/tools/launchpad/build_launchpad.sh

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: launchpad-matter-${{ matrix.target }}
          path: site
          retention-days: 7
          if-no-files-found: error

  # The camera examples build against the KVS WebRTC SDK (KVS_SDK_PATH), which this
  # repo does not carry. examples/camera/standalone is the only one published: split
  # mode needs a second (P4) image from the KVS SDK. Built here: the ESP32-S3-EYE, and
  # the ESP32-P4X-EYE and ESP32-P4-EYE, whose job also builds the C6 network_adapter.
  build-camera:
    # Same gate as `build` — see the note there.
    if: >-
      github.repository_owner == 'espressif' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.idf_image || 'espressif/idf:v6.0.2' }}
    timeout-minutes: 180
    # The P4 entries are optional, so their failure does not block the deploy
    continue-on-error: ${{ matrix.optional || false }}
    env:
      # Keep in step with KVS_SDK_REF in .gitlab/examples_camera.yml.
      KVS_SDK_REF: v1.0.0-rc1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3]
        include:
          # ESP32-P4X-EYE and ESP32-P4-EYE, one image each. The C6 runs the KVS SDK's
          # network_adapter, which the P4 image embeds and writes to the C6 at boot.
          #
          # IDF v6.x rejects the OV2710's RAW input at CSI init, so these jobs patch
          # the IDF: the CSI bridge bypass for RAW input in esp_cam_ctlr_csi.c. Drop
          # idf_patch once a v6.x release has the fix.
          #
          # optional: a failure here only drops these two images from the deploy.
          - target: esp32p4
            board: p4x_eye
            overlays: sdkconfig.defaults.p4_eye.esp32p4
            idf_image: espressif/idf:v6.1.1
            idf_patch: csi_raw_input.patch
            optional: true
          - target: esp32p4
            board: p4_eye
            overlays: sdkconfig.defaults.p4_eye.esp32p4 sdkconfig.defaults.pre_v3.esp32p4
            idf_image: espressif/idf:v6.1.1
            idf_patch: csi_raw_input.patch
            optional: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clone the KVS WebRTC SDK
        shell: bash
        run: |
          git clone -q --depth 1 --branch "$KVS_SDK_REF" --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-port-for-amazon-kvs-sdk.git "$GITHUB_WORKSPACE/../kvs-sdk"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: launchpad-camera-ccache-${{ matrix.target }}${{ matrix.board && format('-{0}', matrix.board) || '' }}-${{ github.sha }}
          restore-keys: |
            launchpad-camera-ccache-${{ matrix.target }}${{ matrix.board && format('-{0}', matrix.board) || '' }}-

      - name: Patch IDF
        if: ${{ matrix.idf_patch }}
        shell: bash
        run: |
          git config --global --add safe.directory "$IDF_PATH"
          git -C "$IDF_PATH" apply --verbose "$GITHUB_WORKSPACE/.github/tools/launchpad/idf_patches/${{ matrix.idf_patch }}"

      # The P4-EYE's C6 has no USB port: the P4 image embeds this build from
      # target-firmware/ and writes it to the C6 at boot.
      - name: Build the C6 network_adapter
        if: ${{ matrix.board }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$IDF_PATH"
          NA="$GITHUB_WORKSPACE/../kvs-sdk/examples/network_adapter"
          idf.py -C "$NA" -B "$NA/build_c6" \
            -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32c6;sdkconfig.defaults.p4_eye_pair.esp32c6' \
            set-target esp32c6 build
          FW="$GITHUB_WORKSPACE/examples/camera/standalone/target-firmware"
          cp "$NA/build_c6/bootloader/bootloader.bin" "$FW/bootloader.bin"
          cp "$NA/build_c6/partition_table/partition-table.bin" "$FW/partition-table.bin"
          cp "$NA/build_c6/network_adapter.bin" "$FW/app.bin"

      # EXAMPLES_DIR/<app>/main finds examples/camera/standalone. split_mode/ sits one
      # level deeper, and components/ has no `main/`, so neither is built.
      - name: Build camera examples
        shell: bash
        env:
          IDF_TARGET: ${{ matrix.target }}
          EXAMPLES_DIR: examples/camera
          APP_PREFIX: camera_
          APP_SUFFIX: ${{ matrix.board && format('_{0}', matrix.board) || '' }}
          LAUNCHPAD_PAGE: ${{ matrix.board && 'LAUNCHPAD.p4_eye.md' || 'LAUNCHPAD.md' }}
          BOARD_OVERLAYS: ${{ matrix.overlays }}
          SITE_DIR: ${{ github.workspace }}/site
          BUILD_TMP: ${{ github.workspace }}/launchpad_camera_build_tmp
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          # pch_defines is left out on purpose: it lets a stale PCH outlive an sdkconfig change.
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          CCACHE_COMPILERCHECK: content
        run: |
          . "$IDF_PATH/export.sh"
          export KVS_SDK_PATH="$(cd "$GITHUB_WORKSPACE/../kvs-sdk" && pwd)"
          pip install idf-build-apps
          ccache --zero-stats || true
          # The container runs as a different user than the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          SDKCONFIG_OVERRIDES=""
          for f in $BOARD_OVERLAYS; do
            SDKCONFIG_OVERRIDES="$SDKCONFIG_OVERRIDES examples/camera/standalone/$f"
          done
          export SDKCONFIG_OVERRIDES
          bash .github/tools/launchpad/build_launchpad.sh
          # The site README names one IDF version, that of the main builds. The
          # board images' page says which IDF they use.
          if [ -n "$BOARD_OVERLAYS" ]; then rm -f "$SITE_DIR/_meta/idf.txt"; fi

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: launchpad-camera-${{ matrix.target }}${{ matrix.board && format('-{0}', matrix.board) || '' }}
          path: site
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build, build-matter, build-camera]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # merge-multiple flattens every target artifact into one tree. Per-app files
      # (LAUNCHPAD.md, _meta/*) are written identically by each target, so overlaps are
      # byte-identical; the per-target binaries land in disjoint <app>/<target>/ dirs.
      - name: Download target builds
        uses: actions/download-artifact@v8
        with:
          pattern: launchpad-*
          path: site
          merge-multiple: true

      - name: Generate launchpad config
        shell: bash
        env:
          SITE_DIR: ${{ github.workspace }}/site
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_SLUG: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/tools/launchpad/generate_launchpad_config.sh

      - name: Generate directory index
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tree
          cd site
          tree -H '.' -L 3 --noreport -T 'ESP RainMaker Neo Launchpad Artifacts' \
            -shi --charset utf-8 -I "index.html" -o index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        shell: bash
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}/"
          {
            echo "### Launchpad deployed"
            echo ""
            echo "- Site: ${BASE}"
            echo "- Config: ${BASE}launchpad.toml"
            echo "- Open in Launchpad: https://espressif.github.io/esp-launchpad/?flashConfigURL=${BASE}launchpad.toml"
          } >> "$GITHUB_STEP_SUMMARY"
