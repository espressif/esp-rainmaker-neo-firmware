variables:
  # Bump whenever tools/docker/posix_test/Dockerfile changes.
  POSIX_TEST_ENV_VERSION: "1"
  POSIX_TEST_ENV_IMAGE: "${CI_REGISTRY_IMAGE}/posix_test_env:${POSIX_TEST_ENV_VERSION}"

.posix_env_template:
  image: ${POSIX_TEST_ENV_IMAGE}

.posix_requirements_template:
  script:
    - python3 -m venv $CI_PROJECT_DIR/.venv
    - source $CI_PROJECT_DIR/.venv/bin/activate
    - pip install -r $CI_PROJECT_DIR/posix_requirements.txt

.esp_env_template:
  image: espressif/idf:${IDF_VERSION}

# Editing the Dockerfile without bumping POSIX_TEST_ENV_VERSION would push the new
# image over the tag main already pulls.
check_posix_test_env_version_bump:
  stage: prepare
  tags: [lint]
  # ensure_base_sha and git show below need git, which the runner's default image
  # (alpine) does not ship. python:3.11 is what pre_commit already pulls on this tag.
  image: python:3.11
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - tools/docker/posix_test/Dockerfile
      when: on_success
  script:
    - |
      if ! ensure_base_sha "$CI_MERGE_REQUEST_DIFF_BASE_SHA"; then
        echo "ERROR: could not resolve MR diff base $CI_MERGE_REQUEST_DIFF_BASE_SHA" >&2
        exit 1
      fi
    - |
      version_of() { sed -n 's/^ *POSIX_TEST_ENV_VERSION: *"\([^"]*\)".*/\1/p'; }
      # Empty on the base side when the variable is introduced by this MR, which
      # differs from the new value and so counts as a bump.
      BASE_VERSION=$(git show "$CI_MERGE_REQUEST_DIFF_BASE_SHA:.gitlab/environment.yml" 2>/dev/null | version_of)
      HEAD_VERSION=$(version_of < .gitlab/environment.yml)
      if [ -z "$HEAD_VERSION" ]; then
        echo "ERROR: POSIX_TEST_ENV_VERSION not found in .gitlab/environment.yml" >&2
        exit 1
      fi
      if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
        echo "ERROR: tools/docker/posix_test/Dockerfile changed but POSIX_TEST_ENV_VERSION is still \"$HEAD_VERSION\"." >&2
        echo "       Bump it in .gitlab/environment.yml so the rebuilt image gets a new tag." >&2
        exit 1
      fi
      echo "POSIX_TEST_ENV_VERSION bumped: ${BASE_VERSION:-<none>} -> $HEAD_VERSION"

update_posix_test_env_image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags: [build]
  # Runs automatically when the image definition changes, so POSIX_TEST_ENV_VERSION's
  # new tag exists before the build stage pulls it.
  needs:
    - job: check_posix_test_env_version_bump
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - tools/docker/posix_test/Dockerfile
          - .gitlab/environment.yml
      when: on_success
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      mkdir -p /kaniko/.docker
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_JOB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/tools/docker/posix_test/Dockerfile" --destination "${POSIX_TEST_ENV_IMAGE}"
