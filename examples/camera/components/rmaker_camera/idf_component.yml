## IDF Component Manager Manifest File
version: "0.8.0"
description: "Camera device, AWS IoT credentials client and KVS WebRTC signaling bring-up for the RainMaker Neo camera examples"
license: "CC0-1.0"
dependencies:
  # Temporary AWS credentials from the IoT Credential Provider
  espressif/rmaker_aws_sign: ~1.0.0

  # RainMaker Neo SDK
  esp_rmaker_neo:
    path: ../../../../components/esp_rmaker_neo
  esp_rmaker_neo_common:
    path: ../../../../components/esp_rmaker_neo_common

  # Signaling-side components from the KVS WebRTC SDK (esp-port-for-amazon-kvs-sdk
  # checkout, pointed to by the KVS_SDK_PATH environment variable). The media
  # plane (kvs_webrtc, media_stream) is pulled in only by the standalone example.
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"
  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"
  kvs_signaling:
    path: ${KVS_SDK_PATH}/components/signaling/kvs_signaling
    version: "*"
