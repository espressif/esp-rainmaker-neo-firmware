## IDF Component Manager Manifest File
version: "0.8.0"
description: "Network provisioning and RainMaker Neo bring-up for the examples. Wi-Fi/Thread on ESP-IDF, no-op on POSIX."
license: "CC0-1.0"
dependencies:
  # Reuse external dependencies from rmaker_app_network
  espressif/rmaker_app_network:
    version: "^1.5.0"
    require: public
    rules:
      - if: "target not in [linux]"
  # Provides osal, which the public header includes.
  esp_rmaker_neo:
    path: ../../../components/esp_rmaker_neo
