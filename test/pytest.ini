[pytest]
testpaths = .
# Single import bootstrap for the suite (paths are relative to this rootdir):
#   .               -> test         (helpers, fwlib, payload, resource_pool)
#   ../tools/common -> tools/common (util.*, rmng_backend, credentials_store)
# pytest applies this in every worker process, so xdist workers get it too. Do not
# re-add per-module ``sys.path`` preludes; tools under tools/ bootstrap themselves
# because they run outside pytest.
pythonpath =
    .
    ../tools/common
# Cap the number of processes to 8 to not DDoS the backend
addopts = --maxprocesses=8
python_files = test_*.py
markers =
    firmware: firmware tests
    stress: stress tests
